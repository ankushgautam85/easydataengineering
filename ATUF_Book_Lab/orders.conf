input {
  http { port => 8080 codec => json }
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["atuf.orders.v3"]
    group_id => "orders-lab"
    auto_offset_reset => "earliest"
    enable_auto_commit => false
    codec => json
  }
}
filter {
  ruby {
    code => '
      required = %w[event_id event_time order_id producer]
      ok = required.all? { |k|
        v = event.get(k)
        v.is_a?(String) && !v.empty?
      }
      a = event.get("amount")
      ok &&= a.is_a?(Numeric) && a.finite? && a >= 0
      ok &&= event.get("schema_version") == 3
      ok &&= event.get("event_type") == "order.created"
      ok &&= event.get("currency") == "USD"
      t = event.get("event_time")
      ok &&= t.is_a?(String) && t.match?(/(Z|[+-]\d\d:\d\d)$/)
      event.tag("contract_error") unless ok
    '
  }
  date {
    match => ["event_time", "ISO8601"]
    target => "@timestamp"
  }
  if "contract_error" not in [tags] and
     "_dateparsefailure" not in [tags] and
     "_jsonparsefailure" not in [tags] {
    ruby {
      code => '
        keep = %w[@timestamp event_id event_type event_time
          producer schema_version order_id amount currency]
        event.to_hash.keys.each { |k|
          event.remove(k) unless keep.include?(k)
        }
      '
    }
    mutate { add_field => { "pipeline_version" => "lab-v1" } }
  }
}
output {
  if "contract_error" in [tags] or
     "_dateparsefailure" in [tags] or
     "_jsonparsefailure" in [tags] {
    file {
      path => "/usr/share/logstash/data/quarantine.ndjson"
      codec => json_lines
    }
  } else {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "atuf-orders-%{+yyyy.MM.dd}"
      document_id => "%{[event_id]}"
      action => "index"
      data_stream => "false"
      manage_template => false
      ilm_enabled => false
    }
  }
}
